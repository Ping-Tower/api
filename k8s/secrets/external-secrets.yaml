# Variables репозитория pingtower/api → Kubernetes Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api
  namespace: pingtower
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: gitlab-pingtower-api
    kind: SecretStore
  target:
    name: api
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: jwt-secret-key
      remoteRef:
        key: JWT_SECRET_KEY
    - secretKey: telegram-bot-token
      remoteRef:
        key: TELEGRAM_BOT_TOKEN
