apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gitlab-pingtower-api
  namespace: pingtower
spec:
  provider:
    gitlab:
      url: https://gitlab.com
      projectID: "77545089"
      environment: "*"
      auth:
        SecretRef:
          accessToken:
            name: gitlab-token
            key: token
